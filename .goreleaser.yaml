# .goreleaser.yaml
version: 2

project_name: wgtun

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/wgtun
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    binary: wgtun

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: wgtun
    homepage: "https://github.com/dncore/wgtun"
    description: "WireGuard orchestrator: a Go TUI managing wireguard-go instances, with a root launchd daemon. Never shell out to wg again."
    license: MIT
    dependencies:
      - wireguard-go
    repository:
      owner: dncore
      name: homebrew-tap
      # Cross-repo push: the default GITHUB_TOKEN cannot write to
      # dncore/homebrew-tap, so a PAT stored as HOMEBREW_TAP_TOKEN is
      # required (see README, Releasing section).
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    service:
      run: [opt_bin/"wgtun", "daemon"]
      keep_alive: true
      working_dir: HOMEBREW_PREFIX
      log_path: "/var/log/wgtun/daemon.out.log"
      error_log_path: "/var/log/wgtun/daemon.err.log"
    caveats: |
      Start the daemon (requires root for the launchd LaunchDaemon):

        sudo brew services start wgtun

      Or install the plist directly:

        sudo wgtun daemon --install

      Then open the TUI with `wgtun`.